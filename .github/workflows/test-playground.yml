name: Test Playground

on:
  push:
    branches: [main]
    paths:
      - 'playground/**'
      - 'playground-tests/**'
      - 'src/**'
      - 'Cargo.toml'
  pull_request:
    branches: [main]
    paths:
      - 'playground/**'
      - 'playground-tests/**'
      - 'src/**'
      - 'Cargo.toml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          target: wasm32-unknown-unknown

      - name: Cache Cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache wasm-pack
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/wasm-pack
          key: ${{ runner.os }}-wasm-pack-0.12.1

      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack &> /dev/null; then
            cargo install wasm-pack@0.12.1
          fi

      - name: Build WASM package
        run: |
          wasm-pack build --target web --features wasm
          mv pkg playground/pkg

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: playground-tests/package-lock.json

      - name: Install dependencies
        run: |
          cd playground-tests
          npm ci

      - name: Install Playwright browsers
        run: |
          cd playground-tests
          npx playwright install chromium --with-deps

      - name: Run Playwright tests
        run: |
          cd playground-tests
          npm test

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: playground-tests/playwright-report/
          retention-days: 7
